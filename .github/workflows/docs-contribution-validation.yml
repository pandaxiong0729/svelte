name: Validate Svelte contributions November 8
on:
  push:
    branches: [codex/validate-docs-20261108]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 18897
            sha: adccf37cd4a104454915f2cce42c33a42960bb61
    name: Issue ${{ matrix.issue }} contribution exact commit
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm lint
      - name: Full test suite
        run: pnpm test --maxWorkers=2
        env:
          CI: true
